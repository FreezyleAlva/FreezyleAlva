<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Freezyle at a gaming workstation with Luau, TypeScript, React, and Next.js code on the monitors">
  <title>Freezyle — AlvaStudio systems engineer at work</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080F"/>
      <stop offset="0.58" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101C35"/>
      <stop offset="1" stop-color="#07101F"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB245" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFB245" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFB245" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1B2944" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="380" rx="16"/></clipPath>
    <clipPath id="leftScreen"><rect x="0" y="0" width="214" height="130" rx="5"/></clipPath>
    <clipPath id="rightScreen"><rect x="0" y="0" width="246" height="150" rx="5"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
    .sans { font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .eyebrow { fill: #7385A4; font-size: 12px; letter-spacing: 3.5px; }
    .title { fill: #F0F4FC; font-size: 64px; font-weight: 800; letter-spacing: -1px; }
    .subtitle { fill: #B6C5DC; font-size: 17px; font-weight: 500; }
    .tag { fill: #8294B2; font-size: 11.5px; letter-spacing: 1.35px; }
    .code { font-size: 10px; }
    .micro { fill: #7183A1; font-size: 9px; letter-spacing: 1.5px; }
    .scan { animation: scan 4.8s linear infinite; }
    .screenPulse { animation: screenPulse 3.2s ease-in-out infinite; }
    .blink { animation: blink 1.4s steps(2, end) infinite; }
    .typing { animation: typing 3.8s ease-in-out infinite; }
    .ambient { animation: ambient 5s ease-in-out infinite; }
    .ambient2 { animation: ambient 6.5s ease-in-out 0.8s infinite; }
    @keyframes scan { 0% { transform: translateY(-150px); opacity: 0; } 12% { opacity: .7; } 88% { opacity: .7; } 100% { transform: translateY(150px); opacity: 0; } }
    @keyframes screenPulse { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
    @keyframes blink { 0%,45% { opacity: 1; } 46%,100% { opacity: .18; } }
    @keyframes typing { 0%,100% { transform: translateX(0); opacity: .75; } 45% { transform: translateX(8px); opacity: 1; } 70% { transform: translateX(2px); opacity: .9; } }
    @keyframes ambient { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) {
      .scan, .screenPulse, .blink, .typing, .ambient, .ambient2 { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)" opacity=".55"/>
    <circle class="ambient" cx="570" cy="56" r="2" fill="#FFB245" opacity=".65"/>
    <circle class="ambient2" cx="1128" cy="42" r="2" fill="#7FA6D8" opacity=".75"/>
    <circle class="ambient2" cx="530" cy="286" r="1.5" fill="#FFB245" opacity=".65"/>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="url(#amber)" opacity=".55"/>
    <rect x="0" y="0" width="1200" height="2" fill="#FFB245" opacity=".9"/>

    <g class="sans">
      <text class="mono eyebrow" x="64" y="82">ALVASTUDIO COMMUNITY / PLAYER 01</text>
      <text class="title" x="62" y="158" textLength="352" lengthAdjust="spacingAndGlyphs">FREEZYLE</text>
      <rect x="64" y="178" width="352" height="1" fill="#243451"/>
      <text class="subtitle" x="64" y="210">Systems engineer who builds and ships.</text>
      <text class="mono tag" x="64" y="246">LUAU  /  TYPESCRIPT  /  REACT  /  NEXT.JS</text>
      <text class="mono tag" x="64" y="268">SERVER AUTHORITY  /  CLEAN SYSTEMS  /  HIGH FPS</text>
      <rect x="64" y="301" width="8" height="8" rx="2" fill="#FFB245"/>
      <text class="mono micro" x="82" y="309">BUILD MODE: ACTIVE</text>
    </g>

    <g transform="translate(604,42)">
      <path d="M44 258H500L548 316H0Z" fill="#0A1120" stroke="#243451"/>
      <path d="M46 258H500" stroke="#FFB245" stroke-width="2" opacity=".8"/>
      <path d="M266 215V258M230 258H302" stroke="#263756" stroke-width="8" stroke-linecap="round"/>

      <g transform="translate(26,24)">
        <rect width="230" height="148" rx="8" fill="#080D18" stroke="#304364" stroke-width="2"/>
        <rect x="8" y="8" width="214" height="130" rx="5" fill="url(#screen)"/>
        <g clip-path="url(#leftScreen)" transform="translate(8,8)">
          <rect class="screenPulse" width="214" height="130" fill="#132444" opacity=".45"/>
          <text class="mono code" x="12" y="22" fill="#FFB245">local</text>
          <text class="mono code" x="46" y="22" fill="#C7D7F0">Net = require(</text>
          <text class="mono code" x="142" y="22" fill="#8BB8E8">"Net"</text>
          <text class="mono code" x="174" y="22" fill="#C7D7F0">)</text>
          <text class="mono code" x="12" y="42" fill="#7FA6D8">function</text>
          <text class="mono code" x="68" y="42" fill="#C7D7F0">Service:Start()</text>
          <text class="mono code" x="22" y="62" fill="#B8C8E2">self.Janitor:Add(</text>
          <text class="mono code" x="124" y="62" fill="#FFB245">connection</text>
          <text class="mono code" x="182" y="62" fill="#C7D7F0">)</text>
          <text class="mono code" x="12" y="82" fill="#7FA6D8">end</text>
          <text class="mono code" x="12" y="108" fill="#536A8D">-- Luau / server authority</text>
          <rect class="blink" x="12" y="116" width="6" height="11" fill="#FFB245"/>
        </g>
        <path d="M92 148H138L151 160H79Z" fill="#1B2944"/>
        <rect x="92" y="160" width="46" height="4" rx="2" fill="#263756"/>
      </g>

      <g transform="translate(288,6)">
        <rect width="262" height="168" rx="8" fill="#080D18" stroke="#3A4F73" stroke-width="2"/>
        <rect x="8" y="8" width="246" height="150" rx="5" fill="url(#screen)"/>
        <g clip-path="url(#rightScreen)" transform="translate(8,8)">
          <rect class="screenPulse" width="246" height="150" fill="#162A4B" opacity=".42"/>
          <text class="mono code" x="12" y="22" fill="#7FA6D8">import</text>
          <text class="mono code" x="55" y="22" fill="#C7D7F0">React</text>
          <text class="mono code" x="89" y="22" fill="#7FA6D8">from</text>
          <text class="mono code" x="124" y="22" fill="#FFB245">'react'</text>
          <text class="mono code" x="12" y="43" fill="#FFB245">export</text>
          <text class="mono code" x="55" y="43" fill="#7FA6D8">default</text>
          <text class="mono code" x="106" y="43" fill="#C7D7F0">function</text>
          <text class="mono code" x="164" y="43" fill="#8BB8E8">App()</text>
          <text class="mono code" x="12" y="64" fill="#C7D7F0">return</text>
          <text class="mono code" x="54" y="64" fill="#FFB245">&lt;NextLayout</text>
          <text class="mono code" x="130" y="64" fill="#8BB8E8">live</text>
          <text class="mono code" x="158" y="64" fill="#C7D7F0">/&gt;</text>
          <text class="mono code" x="12" y="88" fill="#7FA6D8">const</text>
          <text class="mono code" x="50" y="88" fill="#C7D7F0">render =</text>
          <text class="mono code" x="98" y="88" fill="#FFB245">60</text>
          <text class="mono code" x="115" y="88" fill="#536A8D">// fps</text>
          <text class="mono code" x="12" y="108" fill="#536A8D">// TypeScript / React / Next.js</text>
          <path d="M12 116H222" stroke="#243A5E"/>
          <g class="typing">
            <text class="mono code" x="12" y="140" fill="#B8C8E2">npm run build</text>
            <rect x="94" y="130" width="6" height="12" fill="#FFB245"/>
          </g>
        </g>
        <path d="M104 168H158L172 182H90Z" fill="#1B2944"/>
        <rect x="106" y="182" width="50" height="4" rx="2" fill="#263756"/>
      </g>

      <g transform="translate(264,172)">
        <g class="ambient">
        <circle cx="0" cy="0" r="26" fill="#0D1423" stroke="#405579" stroke-width="2"/>
        <path d="M-16 5Q0 20 16 5L22 46H-22Z" fill="#101B31" stroke="#405579" stroke-width="2"/>
        <path d="M-16 24L-42 48M16 24L42 48" stroke="#405579" stroke-width="8" stroke-linecap="round"/>
        <circle cx="-8" cy="-2" r="3" fill="#FFB245" filter="url(#glow)"/>
        <circle cx="8" cy="-2" r="3" fill="#FFB245" filter="url(#glow)"/>
        <path d="M-8 9Q0 14 8 9" fill="none" stroke="#8BB8E8" stroke-width="2"/>
        <path d="M-8 45H8" stroke="#FFB245" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>

      <g transform="translate(116,290)">
        <rect width="136" height="10" rx="5" fill="#17243B" stroke="#2A3D5F"/>
        <path d="M14 5H122M25 2V8M38 2V8M51 2V8M64 2V8M77 2V8M90 2V8M103 2V8" stroke="#7FA6D8" stroke-width="1" opacity=".65"/>
        <circle class="blink" cx="126" cy="5" r="2" fill="#FFB245"/>
      </g>
      <text class="mono micro" x="404" y="318">LIVE / BUILD / SHIP</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="379" rx="16" fill="none" stroke="#253656"/>
  </g>
</svg>
