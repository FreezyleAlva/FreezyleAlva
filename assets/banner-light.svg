<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Freezyle at a gaming workstation with Luau, TypeScript, React, and Next.js code on the monitors">
  <title>Freezyle — AlvaStudio systems engineer at work</title>
  <defs>
    <linearGradient id="bgl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#F5F7FB"/>
      <stop offset="1" stop-color="#E9EEF6"/>
    </linearGradient>
    <linearGradient id="screenl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF5FF"/>
      <stop offset="1" stop-color="#DDE9F8"/>
    </linearGradient>
    <linearGradient id="amberl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B4650A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#B4650A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#B4650A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridl" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#DCE4F0" stroke-width="1"/>
    </pattern>
    <filter id="glowl" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="framel"><rect width="1200" height="380" rx="16"/></clipPath>
    <clipPath id="leftScreenl"><rect x="0" y="0" width="214" height="130" rx="5"/></clipPath>
    <clipPath id="rightScreenl"><rect x="0" y="0" width="246" height="150" rx="5"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
    .sans { font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .eyebrow { fill: #5A6A82; font-size: 12px; letter-spacing: 3.5px; }
    .title { fill: #0A1120; font-size: 64px; font-weight: 800; letter-spacing: -1px; }
    .subtitle { fill: #33445E; font-size: 17px; font-weight: 500; }
    .tag { fill: #5A6A82; font-size: 11.5px; letter-spacing: 1.35px; }
    .code { font-size: 10px; }
    .micro { fill: #5A6A82; font-size: 9px; letter-spacing: 1.5px; }
    .scan { animation: scan 4.8s linear infinite; }
    .screenPulse { animation: screenPulse 3.2s ease-in-out infinite; }
    .blink { animation: blink 1.4s steps(2, end) infinite; }
    .typing { animation: typing 3.8s ease-in-out infinite; }
    .ambient { animation: ambient 5s ease-in-out infinite; }
    .ambient2 { animation: ambient 6.5s ease-in-out .8s infinite; }
    @keyframes scan { 0% { transform: translateY(-150px); opacity: 0; } 12% { opacity: .55; } 88% { opacity: .55; } 100% { transform: translateY(150px); opacity: 0; } }
    @keyframes screenPulse { 0%,100% { opacity: .55; } 50% { opacity: .9; } }
    @keyframes blink { 0%,45% { opacity: 1; } 46%,100% { opacity: .18; } }
    @keyframes typing { 0%,100% { transform: translateX(0); opacity: .7; } 45% { transform: translateX(8px); opacity: 1; } 70% { transform: translateX(2px); opacity: .85; } }
    @keyframes ambient { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) {
      .scan, .screenPulse, .blink, .typing, .ambient, .ambient2 { animation: none; }
    }
  </style>

  <g clip-path="url(#framel)">
    <rect width="1200" height="380" fill="url(#bgl)"/>
    <rect width="1200" height="380" fill="url(#gridl)" opacity=".8"/>
    <circle class="ambient" cx="570" cy="56" r="2" fill="#B4650A" opacity=".55"/>
    <circle class="ambient2" cx="1128" cy="42" r="2" fill="#4A6E9E" opacity=".65"/>
    <circle class="ambient2" cx="530" cy="286" r="1.5" fill="#B4650A" opacity=".55"/>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="url(#amberl)" opacity=".5"/>
    <rect x="0" y="0" width="1200" height="2" fill="#B4650A" opacity=".9"/>

    <g class="sans">
      <text class="mono eyebrow" x="64" y="82">ALVASTUDIO COMMUNITY / PLAYER 01</text>
      <text class="title" x="62" y="158" textLength="352" lengthAdjust="spacingAndGlyphs">FREEZYLE</text>
      <rect x="64" y="178" width="352" height="1" fill="#D1DCEB"/>
      <text class="subtitle" x="64" y="210">Systems engineer who builds and ships.</text>
      <text class="mono tag" x="64" y="246">LUAU  /  TYPESCRIPT  /  REACT  /  NEXT.JS</text>
      <text class="mono tag" x="64" y="268">SERVER AUTHORITY  /  CLEAN SYSTEMS  /  HIGH FPS</text>
      <rect x="64" y="301" width="8" height="8" rx="2" fill="#B4650A"/>
      <text class="mono micro" x="82" y="309">BUILD MODE: ACTIVE</text>
    </g>

    <g transform="translate(604,42)">
      <path d="M44 258H500L548 316H0Z" fill="#E4EAF3" stroke="#C4D1E2"/>
      <path d="M46 258H500" stroke="#B4650A" stroke-width="2" opacity=".8"/>
      <path d="M266 215V258M230 258H302" stroke="#C2CFDF" stroke-width="8" stroke-linecap="round"/>

      <g transform="translate(26,24)">
        <rect width="230" height="148" rx="8" fill="#F8FAFD" stroke="#AEBFD5" stroke-width="2"/>
        <rect x="8" y="8" width="214" height="130" rx="5" fill="url(#screenl)"/>
        <g clip-path="url(#leftScreenl)" transform="translate(8,8)">
          <rect class="screenPulse" width="214" height="130" fill="#D9E8FB" opacity=".55"/>
          <text class="mono code" x="12" y="22" fill="#9A5A0B">local</text>
          <text class="mono code" x="46" y="22" fill="#33445E">Net = require(</text>
          <text class="mono code" x="142" y="22" fill="#35699D">"Net"</text>
          <text class="mono code" x="174" y="22" fill="#33445E">)</text>
          <text class="mono code" x="12" y="42" fill="#35699D">function</text>
          <text class="mono code" x="68" y="42" fill="#33445E">Service:Start()</text>
          <text class="mono code" x="22" y="62" fill="#4C607D">self.Janitor:Add(</text>
          <text class="mono code" x="124" y="62" fill="#9A5A0B">connection</text>
          <text class="mono code" x="182" y="62" fill="#33445E">)</text>
          <text class="mono code" x="12" y="82" fill="#35699D">end</text>
          <text class="mono code" x="12" y="108" fill="#71839C">-- Luau / server authority</text>
          <rect class="blink" x="12" y="116" width="6" height="11" fill="#B4650A"/>
        </g>
        <path d="M92 148H138L151 160H79Z" fill="#C2CFDF"/>
        <rect x="92" y="160" width="46" height="4" rx="2" fill="#AEBFD5"/>
      </g>

      <g transform="translate(288,6)">
        <rect width="262" height="168" rx="8" fill="#F8FAFD" stroke="#9EAFCA" stroke-width="2"/>
        <rect x="8" y="8" width="246" height="150" rx="5" fill="url(#screenl)"/>
        <g clip-path="url(#rightScreenl)" transform="translate(8,8)">
          <rect class="screenPulse" width="246" height="150" fill="#D9E8FB" opacity=".52"/>
          <text class="mono code" x="12" y="22" fill="#35699D">import</text>
          <text class="mono code" x="55" y="22" fill="#33445E">React</text>
          <text class="mono code" x="89" y="22" fill="#35699D">from</text>
          <text class="mono code" x="124" y="22" fill="#9A5A0B">'react'</text>
          <text class="mono code" x="12" y="43" fill="#9A5A0B">export</text>
          <text class="mono code" x="55" y="43" fill="#35699D">default</text>
          <text class="mono code" x="106" y="43" fill="#33445E">function</text>
          <text class="mono code" x="164" y="43" fill="#35699D">App()</text>
          <text class="mono code" x="12" y="64" fill="#33445E">return</text>
          <text class="mono code" x="54" y="64" fill="#9A5A0B">&lt;NextLayout</text>
          <text class="mono code" x="130" y="64" fill="#35699D">live</text>
          <text class="mono code" x="158" y="64" fill="#33445E">/&gt;</text>
          <text class="mono code" x="12" y="88" fill="#35699D">const</text>
          <text class="mono code" x="50" y="88" fill="#33445E">render =</text>
          <text class="mono code" x="98" y="88" fill="#9A5A0B">60</text>
          <text class="mono code" x="115" y="88" fill="#71839C">// fps</text>
          <text class="mono code" x="12" y="108" fill="#71839C">// TypeScript / React / Next.js</text>
          <path d="M12 116H222" stroke="#C5D6EA"/>
          <g class="typing">
            <text class="mono code" x="12" y="140" fill="#4C607D">npm run build</text>
            <rect x="94" y="130" width="6" height="12" fill="#B4650A"/>
          </g>
        </g>
        <path d="M104 168H158L172 182H90Z" fill="#C2CFDF"/>
        <rect x="106" y="182" width="50" height="4" rx="2" fill="#AEBFD5"/>
      </g>

      <g transform="translate(264,172)">
        <g class="ambient">
        <circle cx="0" cy="0" r="26" fill="#E4EAF3" stroke="#899DB9" stroke-width="2"/>
        <path d="M-16 5Q0 20 16 5L22 46H-22Z" fill="#D5DFED" stroke="#899DB9" stroke-width="2"/>
        <path d="M-16 24L-42 48M16 24L42 48" stroke="#899DB9" stroke-width="8" stroke-linecap="round"/>
        <circle cx="-8" cy="-2" r="3" fill="#B4650A" filter="url(#glowl)"/>
        <circle cx="8" cy="-2" r="3" fill="#B4650A" filter="url(#glowl)"/>
        <path d="M-8 9Q0 14 8 9" fill="none" stroke="#35699D" stroke-width="2"/>
        <path d="M-8 45H8" stroke="#B4650A" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>

      <g transform="translate(116,290)">
        <rect width="136" height="10" rx="5" fill="#D3DEEC" stroke="#A9BAD1"/>
        <path d="M14 5H122M25 2V8M38 2V8M51 2V8M64 2V8M77 2V8M90 2V8M103 2V8" stroke="#6B87AD" stroke-width="1" opacity=".65"/>
        <circle class="blink" cx="126" cy="5" r="2" fill="#B4650A"/>
      </g>
      <text class="mono micro" x="404" y="318">LIVE / BUILD / SHIP</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="379" rx="16" fill="none" stroke="#C6D3E4"/>
  </g>
</svg>
