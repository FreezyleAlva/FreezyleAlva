name: profile-game-bot

# Anyone can open an issue titled `game/ttt: move <1-9>` from the README board.
# This workflow validates it, plays the bot reply, rewrites the board in the
# README and closes the issue.

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Serialise turns. Two players opening issues at the same moment must not race
# on the same state file, so queue instead of cancelling.
concurrency:
  group: profile-game-bot
  cancel-in-progress: false

jobs:
  play:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'game/ttt:')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve turn
        # Untrusted values are passed through env, never interpolated into the
        # shell. `${{ github.event.issue.title }}` inside a run block is a
        # command injection vector.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          TTT_DIFFICULTY: casual
        run: node .github/scripts/game-bot.mjs

      - name: Commit board state
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- README.md .github/game/state.json; then
            echo "No board change to commit."
            exit 0
          fi

          git add README.md .github/game/state.json
          git commit -m "chore(game): update tic-tac-toe board [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
